name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the release builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Build the portable executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./scripts/build_release.ps1 -Version $version -Python python

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -LiteralPath release -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Release executable is missing.' }
          gh release create $tag `
            $exe.FullName `
            (Resolve-Path 'release/SHA256SUMS.txt') `
            --verify-tag `
            --generate-notes `
            --title "LOL Support Advisor $tag"
